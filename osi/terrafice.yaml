version: 0.1.1
semantic_model:
- name: terrafice
  description: Terrafice (powered land / data center sites) semantic model for SunflowerOS.
  ai_context:
    instructions: Terrafice = Sahil's powered-land business (internal view key 'land'). Scores 0-100. Power-capacity figures are estimates unless
      sourced.
    synonyms:
    - powered land
    - data center land
    - land
  datasets:
  - name: land_sites
    source: firestore:dms-edvc/sites (view==land)
    primary_key:
    - site_id
    fields:
    - name: site_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: site_id
      description: Firestore document id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "__name__", "namespace": "edifice_sunflower"}'
    - name: name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: name
      ai_context:
        synonyms:
        - deal
        - site
        - property
        - listing
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "j.name", "namespace": "edifice_sunflower"}'
    - name: view
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: view
      description: land|storage internal key; label Terrafice|Everstow
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "view", "namespace": "edifice_sunflower"}'
    - name: lat
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: lat
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Float", "firestore_path": "j.lat", "namespace": "edifice_sunflower"}'
    - name: lon
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: lon
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Float", "firestore_path": "j.lon", "namespace": "edifice_sunflower"}'
    - name: city
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: city
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "j.city", "namespace": "edifice_sunflower"}'
    - name: county
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: county
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "j.county", "namespace": "edifice_sunflower"}'
    - name: acres
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: acres
      ai_context:
        synonyms:
        - acreage
        - size
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.acres", "namespace": "edifice_sunflower"}'
    - name: stage
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: stage
      description: Latest pipeline stage
      ai_context:
        synonyms:
        - status
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "stage", "namespace": "edifice_sunflower"}'
    - name: score
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: score
      description: Overall 0-100 score
      ai_context:
        synonyms:
        - rating
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "j.score", "namespace": "edifice_sunflower"}'
    - name: updated
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: updated
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "DateTimeTz", "firestore_path": "updated", "namespace": "edifice_sunflower"}'
    - name: price_per_acre
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: price_per_acre
      ai_context:
        synonyms:
        - $/acre
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.price.per_acre", "namespace": "edifice_sunflower"}'
    - name: line_kv_best
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: line_kv_best
      description: Highest nearby line voltage (kV)
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "j.power.lines_by_class[].class", "namespace": "edifice_sunflower"}'
    - name: line_mi
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: line_mi
      description: Distance to 69+ kV line
      ai_context:
        synonyms:
        - distance to power
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.power.lines_by_class[].mi", "namespace": "edifice_sunflower"}'
    - name: substation_mi
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: substation_mi
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.power.substation.mi", "namespace": "edifice_sunflower"}'
    - name: gas_mi
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: gas_mi
      ai_context:
        synonyms:
        - distance to gas
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.gasline.mi", "namespace": "edifice_sunflower"}'
    - name: floodplain
