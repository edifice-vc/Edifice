version: 0.1.1
semantic_model:
- name: terrafice
  description: Terrafice (powered land / data center sites) semantic model for SunflowerOS.
  ai_context:
    instructions: Terrafice = Sahil's powered-land business (internal view key 'land'). Scores 0-100. Power-capacity figures are estimates unless
      sourced.
    synonyms:
    - powered land
    - data center land
    - land
  datasets:
  - name: land_sites
    source: firestore:dms-edvc/sites (view==land)
    primary_key:
    - site_id
    fields:
    - name: site_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: site_id
      description: Firestore document id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "__name__", "namespace": "edifice_sunflower"}'
    - name: name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: name
      ai_context:
        synonyms:
        - deal
        - site
        - property
        - listing
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "j.name", "namespace": "edifice_sunflower"}'
    - name: view
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: view
      description: land|storage internal key; label Terrafice|Everstow
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "view", "namespace": "edifice_sunflower"}'
    - name: lat
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: lat
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Float", "firestore_path": "j.lat", "namespace": "edifice_sunflower"}'
    - name: lon
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: lon
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Float", "firestore_path": "j.lon", "namespace": "edifice_sunflower"}'
    - name: city
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: city
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "j.city", "namespace": "edifice_sunflower"}'
    - name: county
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: county
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "j.county", "namespace": "edifice_sunflower"}'
    - name: acres
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: acres
      ai_context:
        synonyms:
        - acreage
        - size
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.acres", "namespace": "edifice_sunflower"}'
    - name: stage
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: stage
      description: Latest pipeline stage
      ai_context:
        synonyms:
        - status
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "stage", "namespace": "edifice_sunflower"}'
    - name: score
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: score
      description: Overall 0-100 score
      ai_context:
        synonyms:
        - rating
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "j.score", "namespace": "edifice_sunflower"}'
    - name: updated
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: updated
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "DateTimeTz", "firestore_path": "updated", "namespace": "edifice_sunflower"}'
    - name: price_per_acre
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: price_per_acre
      ai_context:
        synonyms:
        - $/acre
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.price.per_acre", "namespace": "edifice_sunflower"}'
    - name: line_kv_best
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: line_kv_best
      description: Highest nearby line voltage (kV)
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "j.power.lines_by_class[].class", "namespace": "edifice_sunflower"}'
    - name: line_mi
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: line_mi
      description: Distance to 69+ kV line
      ai_context:
        synonyms:
        - distance to power
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.power.lines_by_class[].mi", "namespace": "edifice_sunflower"}'
    - name: substation_mi
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: substation_mi
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.power.substation.mi", "namespace": "edifice_sunflower"}'
    - name: gas_mi
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: gas_mi
      ai_context:
        synonyms:
        - distance to gas
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "j.gasline.mi", "namespace": "edifice_sunflower"}'
    - name: floodplain
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: floodplain
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Boolean", "firestore_path": "j.floodplain", "namespace": "edifice_sunflower"}'
    - name: community_score
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: community_score
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "j.community.score", "namespace": "edifice_sunflower"}'
    - name: market_score
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: market_score
      description: Market & power competition 0-100, 50 neutral
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "j.market.score", "namespace": "edifice_sunflower"}'
    - name: plan_it_mw
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: plan_it_mw
      description: Site Planning best IT MW (local-only V1)
      ai_context:
        synonyms:
        - MW
        - capacity
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "plan.it_mw", "namespace": "edifice_sunflower"}'
    - name: plan_limiter
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: plan_limiter
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "plan.limited_by", "namespace": "edifice_sunflower"}'
    - name: plan_cost_per_mw
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: plan_cost_per_mw
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "plan.cost_per_mw", "namespace": "edifice_sunflower"}'
  - name: stage_events
    source: firestore:dms-edvc/sites/{id}/events
    primary_key:
    - event_id
    description: Every stage move with Sahil's reasons — primary outcome/training signal.
    fields:
    - name: event_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: event_id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "event_id", "namespace": "edifice_sunflower"}'
    - name: site_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: site_id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "site_id", "namespace": "edifice_sunflower"}'
    - name: to_stage
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: to_stage
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "to_stage", "namespace": "edifice_sunflower"}'
    - name: from_stage
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: from_stage
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "from_stage", "namespace": "edifice_sunflower"}'
    - name: reasons
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: reasons
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "reasons", "namespace": "edifice_sunflower"}'
    - name: ts
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ts
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "DateTimeTz", "firestore_path": "timestamp", "namespace": "edifice_sunflower"}'
  - name: dc_projects
    source: repo:pipeline/dc_tracker_enrich.json (morethanjustparks tracker, weekly)
    primary_key:
    - project_id
    fields:
    - name: project_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: project_id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "id", "namespace": "edifice_sunflower"}'
    - name: name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: name
      ai_context:
        synonyms:
        - data center project
        - competitor project
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "name", "namespace": "edifice_sunflower"}'
    - name: developer
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: developer
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "developer", "namespace": "edifice_sunflower"}'
    - name: status
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: status
      description: proposed|approved|under_construction|operational|withdrawn|cancelled|defeated
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "status", "namespace": "edifice_sunflower"}'
    - name: mw
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: mw
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "mw", "namespace": "edifice_sunflower"}'
    - name: acres
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: acres
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "acres", "namespace": "edifice_sunflower"}'
    - name: county
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: county
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "county", "namespace": "edifice_sunflower"}'
    - name: substation
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: substation
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "substation", "namespace": "edifice_sunflower"}'
  - name: substations
    source: HIFLD/OSM via map_layers.py
    primary_key:
    - substation_id
    fields:
    - name: substation_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: substation_id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "id", "namespace": "edifice_sunflower"}'
    - name: name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: name
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "name", "namespace": "edifice_sunflower"}'
    - name: kv
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: kv
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "max_kv", "namespace": "edifice_sunflower"}'
  - name: transmission_lines
    source: HIFLD via map_layers.py
    primary_key:
    - line_id
    fields:
    - name: line_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: line_id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "id", "namespace": "edifice_sunflower"}'
    - name: kv
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: kv
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "voltage", "namespace": "edifice_sunflower"}'
    - name: owner
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: owner
      ai_context:
        synonyms:
        - utility
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "owner", "namespace": "edifice_sunflower"}'
  - name: site_plans
    source: browser localStorage (V1); proposed firestore:sitePlans
    primary_key:
    - plan_id
    fields:
    - name: plan_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: plan_id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "id", "namespace": "edifice_sunflower"}'
    - name: site_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: site_id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "site_id", "namespace": "edifice_sunflower"}'
    - name: it_mw
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: it_mw
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "it_mw", "namespace": "edifice_sunflower"}'
    - name: total_mw
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: total_mw
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "total_mw", "namespace": "edifice_sunflower"}'
    - name: limited_by
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: limited_by
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "limited_by", "namespace": "edifice_sunflower"}'
    - name: capex
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: capex
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "cost", "namespace": "edifice_sunflower"}'
    - name: w_per_sf
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: w_per_sf
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "w_per_sf", "namespace": "edifice_sunflower"}'
    - name: pue
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: pue
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "pue", "namespace": "edifice_sunflower"}'
    - name: created
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: created
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "DateTimeTz", "firestore_path": "ts", "namespace": "edifice_sunflower"}'
  - name: jurisdictions
    source: repo:dc-references/standards/standards.json
    primary_key:
    - jurisdiction
    fields:
    - name: jurisdiction
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: jurisdiction
      ai_context:
        synonyms:
        - city
        - county
        - municipality
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "jurisdiction", "namespace": "edifice_sunflower"}'
  - name: local_standards
    source: repo:dc-references/standards/standards.json#standards
    primary_key:
    - standard_id
    description: Cited development standards (code requirement vs observed in project vs draft).
    fields:
    - name: standard_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: standard_id
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "index", "namespace": "edifice_sunflower"}'
    - name: jurisdiction
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: jurisdiction
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "jurisdiction", "namespace": "edifice_sunflower"}'
    - name: category
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: category
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "category", "namespace": "edifice_sunflower"}'
    - name: value
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: value
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "value", "namespace": "edifice_sunflower"}'
    - name: source_doc
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: source_doc
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "source", "namespace": "edifice_sunflower"}'
    - name: page
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: page
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "page", "namespace": "edifice_sunflower"}'
    - name: label
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: label
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "label", "namespace": "edifice_sunflower"}'
  relationships:
  - name: events_to_site
    from: stage_events
    to: land_sites
    from_columns:
    - site_id
    to_columns:
    - site_id
  - name: plans_to_site
    from: site_plans
    to: land_sites
    from_columns:
    - site_id
    to_columns:
    - site_id
  - name: standards_to_jurisdiction
    from: local_standards
    to: jurisdictions
    from_columns:
    - jurisdiction
    to_columns:
    - jurisdiction
  metrics:
  - name: mw_per_acre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(site_plans.it_mw) / SUM(land_sites.acres)
    description: Planned IT MW per acre
    ai_context:
      synonyms:
      - density
    custom_extensions:
    - vendor_name: COMMON
      data: '{"datatype": "Decimal", "namespace": "edifice_sunflower"}'
  - name: pipeline_it_mw
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(land_sites.plan_it_mw)
    description: Total planned IT MW across Terrafice deals
    custom_extensions:
    - vendor_name: COMMON
      data: '{"datatype": "Decimal", "namespace": "edifice_sunflower"}'
  - name: avg_price_per_acre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(land_sites.price_per_acre)
    description: Average asking $/acre
    custom_extensions:
    - vendor_name: COMMON
      data: '{"datatype": "Decimal", "namespace": "edifice_sunflower"}'
  - name: pursue_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN stage_events.to_stage IN ('Reviewing','Contacted','In Diligence','LOI Submitted','Under Contract','Closed')
          THEN stage_events.event_id END)
    description: Decisions to pursue
    custom_extensions:
    - vendor_name: COMMON
      data: '{"datatype": "Integer", "namespace": "edifice_sunflower"}'
  custom_extensions:
  - vendor_name: COMMON
    data: '{"market_score_config": {"_doc": "Terrafice ''Market & power competition'' component (0-100, 50 = neutral). Mirrored in template.html
      (MC_CFG). Overall = overall_base + round(max_adj*(market-50)/50), so a neutral market changes nothing; floodplain cap kept.", "active_status":
      ["proposed", "approved", "under_construction", "operational"], "land": {"acres_min": 250, "hyperscalers": "Google|Meta|Amazon|AWS|Microsoft|QTS|Digital
      Realty|Oracle|Nebius|Compass|Beale|Lambda", "pts": -5, "radius_mi": 10}, "max_adj": 10, "opposition": {"lawsuit_mi": 25, "lawsuit_pts":
      -6, "moratorium_county_pts": -25, "stopped_max": -16, "stopped_mi": 25, "stopped_pts": -8}, "power": {"max_pts": 35, "mid_mi": 15, "mw_per_point":
      40, "near_mi": 5, "radius_mi": 30, "same_sub_mult": 2.0, "w_far": 0.2, "w_mid": 0.5, "w_near": 1.0}, "precedent": {"near_pts": 5, "same_county_pts":
      10, "statuses": ["approved", "under_construction", "operational"], "within_mi": 15}, "stopped_status": ["withdrawn", "cancelled", "defeated"],
      "unknown_mw": 100}, "namespace": "edifice_sunflower", "provenance": "pipeline/market_score.json; Sahil messages; memory"}'
