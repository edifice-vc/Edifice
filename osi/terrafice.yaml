  relationships:
  - name: events_to_site
    from: stage_events
    to: land_sites
    from_columns:
    - site_id
    to_columns:
    - site_id
  - name: plans_to_site
    from: site_plans
    to: land_sites
    from_columns:
    - site_id
    to_columns:
    - site_id
  - name: standards_to_jurisdiction
    from: local_standards
    to: jurisdictions
    from_columns:
    - jurisdiction
    to_columns:
    - jurisdiction
  metrics:
  - name: mw_per_acre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(site_plans.it_mw) / SUM(land_sites.acres)
    description: Planned IT MW per acre
    ai_context:
      synonyms:
      - density
    custom_extensions:
    - vendor_name: COMMON
      data: '{"datatype": "Decimal", "namespace": "edifice_sunflower"}'
  - name: pipeline_it_mw
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(land_sites.plan_it_mw)
    description: Total planned IT MW across Terrafice deals
    custom_extensions:
    - vendor_name: COMMON
      data: '{"datatype": "Decimal", "namespace": "edifice_sunflower"}'
  - name: avg_price_per_acre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(land_sites.price_per_acre)
    description: Average asking $/acre
    custom_extensions:
    - vendor_name: COMMON
      data: '{"datatype": "Decimal", "namespace": "edifice_sunflower"}'
  - name: pursue_count
