      description: Market & power competition 0-100, 50 neutral
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Integer", "firestore_path": "j.market.score", "namespace": "edifice_sunflower"}'
    - name: plan_it_mw
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: plan_it_mw
      description: Site Planning best IT MW (local-only V1)
      ai_context:
        synonyms:
        - MW
        - capacity
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "Decimal", "firestore_path": "plan.it_mw", "namespace": "edifice_sunflower"}'
    - name: plan_limiter
      expression:
        dialects:
