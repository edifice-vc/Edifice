          expression: plan_limiter
      custom_extensions:
      - vendor_name: COMMON
        data: '{"datatype": "String", "firestore_path": "plan.limited_by", "namespace": "edifice_sunflower"}'
    - name: plan_cost_per_mw
      expression:
        dialects:
        - dialect: ANSI_SQL
